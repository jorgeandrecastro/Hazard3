
[package]
name = "rp-pac-riscv"
version = "0.2.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/jorgeandrecastro/embassy-riscv"
documentation = "https://docs.rs/rp-pac-riscv"
readme = "README.md"
description = "RISC-V Peripheral Access Crate for Raspberry Pi RP235x microcontrollers."
keywords = ["embedded", "pac", "riscv", "rp2350", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
exclude = ["target/", "Cargo.lock"]

[lib]
name = "rp_pac"

[dependencies]
defmt = { version = "0.3.10", optional = true }
riscv = { version = "0.16", default-features = false, optional = true }

[features]
default = []
rp235x = ["dep:riscv"]
rt = []
defmt = ["dep:defmt"]
debug = []

[package.metadata.embassy_docs]
src_base = "https://github.com/jorgeandrecastro/embassy-riscv/blob/main/rp-pac-riscv/src/"
src_base_git = "https://github.com/jorgeandrecastro/embassy-riscv/blob/main/rp-pac-riscv/src/"
flavors = [
    { name = "rp235x", features = ["rp235x"], target = "riscv32imac-unknown-none-elf" },
]

[package.metadata.docs.rs]
targets = ["riscv32imac-unknown-none-elf"]
features = ["defmt", "rp235x"]
