[package]
name = "hazard3-unitrait-macros"
version = "0.3.0"
edition = "2024"
description = "Implementation detail of the `unitrait` crate"
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-unitrait-macros"
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["target/", "Cargo.lock"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
hazard3-unitrait = { path = "../hazard3-unitrait" }
