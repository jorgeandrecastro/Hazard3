[package]
name = "hazard3-unitrait"
version = "0.3.0"
edition = "2024"
description = "Traits with a single global implementation, resolved at link time"
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-unitrait"
readme = "README.md"
license = "MIT OR Apache-2.0"
exclude = ["target/", "Cargo.lock"]
categories = [
    "embedded",
    "no-std",
    "rust-patterns",
]

[lib]

[dependencies]
hazard3-unitrait-macros = { version = "0.3.0", path = "../hazard3-unitrait-macros" }

[dev-dependencies]
trybuild = "1.0"
