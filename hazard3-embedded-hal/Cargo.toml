[package]
name = "hazard3-embedded-hal"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Collection of utilities to use `embedded-hal` and `embedded-storage` traits with Embassy."
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-embedded-hal"
readme = "README.md"
exclude = ["target/", "Cargo.lock"]
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = []},
    {target = "thumbv7em-none-eabi", features = ["time"]},
]


[package.metadata.embassy_docs]
src_base = "https://github.com/jorgeandrecastro/Hazard3/blob/main/hazard3-embedded-hal/src/"
src_base_git = "https://github.com/jorgeandrecastro/Hazard3/blob/main/hazard3-embedded-hal/src/"
target = "x86_64-unknown-linux-gnu"

[features]
defmt = ["dep:defmt"]
time = ["dep:hazard3-time"]

[lib]

[dependencies]
hazard3-futures = { version = "0.1.0", path = "../hazard3-futures" }
hazard3-sync = { version = "0.2.0", path = "../hazard3-sync" }
hazard3-time = { version = "0.2.0", path = "../hazard3-time", optional = true }
embedded-hal-02 = { package = "embedded-hal", version = "0.2.6", features = [
    "unproven",
] }
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-storage = "0.3.1"
embedded-storage-async = { version = "0.4.1" }

defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
critical-section = { version = "1.1.1", features = ["std"] }
futures-test = "0.3.17"
