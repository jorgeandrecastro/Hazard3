[package]
name = "hazard3-cyw43-pio"
version = "0.3.0"
edition = "2024"
description = "RP2350 RISC-V PIO SPI implementation for cyw43"
keywords = ["embedded", "cyw43", "embassy-net", "embedded-hal-async", "wifi"]
categories = ["embedded", "hardware-support", "no-std", "network-programming", "asynchronous"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-cyw43-pio"
readme = "README.md"
exclude = ["target/", "Cargo.lock"]

[lib]

[dependencies]
hazard3-cyw43 = { version = "0.3.0", path = "../hazard3-cyw43" }
hazard3-rp = { version = "0.3.0", path = "../hazard3-rp" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
hazard3-net-async = { version = "0.6.0", path = "../hazard3-net-async", features = ["medium-ethernet", "ipv4"] }

[[test]]
name = "compatibility"
harness = false

[features]
defmt = ["dep:defmt"]

[package.metadata.embassy]
build = [
    {target = "riscv32imac-unknown-none-elf", features = ["hazard3-rp/rp235xa"]},
    {target = "riscv32imac-unknown-none-elf", features = ["hazard3-rp/rp235xb", "defmt"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/jorgeandrecastro/Hazard3/blob/main/hazard3-cyw43-pio/src/"
src_base_git = "https://github.com/jorgeandrecastro/Hazard3/blob/$COMMIT/hazard3-cyw43-pio/src/"
target = "riscv32imac-unknown-none-elf"
features = ["hazard3-rp/rp235xa"]

[package.metadata.docs.rs]
default-target = "riscv32imac-unknown-none-elf"
targets = ["riscv32imac-unknown-none-elf"]
features = ["hazard3-rp/rp235xa"]
