[package]
name = "unitrait-riscv"
version = "0.1.0"
edition = "2024"
description = "Traits with a single global implementation, resolved at link time"
repository = "https://github.com/jorgeandrecastro/embassy-riscv"
documentation = "https://docs.rs/unitrait-riscv"
readme = "README.md"
license = "MIT OR Apache-2.0"
exclude = ["target/", "Cargo.lock"]
categories = [
    "embedded",
    "no-std",
    "rust-patterns",
]

[lib]
name = "unitrait"

[dependencies]
unitrait-macros = { package = "unitrait-macros-riscv", version = "0.1.0", path = "../unitrait-macros" }

[dev-dependencies]
trybuild = "1.0"
