[package]
name = "hazard3-executor-timer-queue"
version = "0.3.0"
edition = "2024"
description = "Timer queue item and interface between embassy-executor and timer queues"
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-executor-timer-queue"
readme = "README.md"
license = "MIT OR Apache-2.0"
exclude = ["target/", "Cargo.lock"]
categories = [
    "embedded",
    "no-std",
    "concurrency",
    "asynchronous",
]

# Prevent multiple copies of this crate in the same binary.
# Needed because different copies might get different features set
# like the word size, causing unsoundness.
links = "embassy-executor-timer-queue"

[lib]

[dependencies]
hazard3-unitrait = { version = "0.3.0", path = "../hazard3-unitrait" }

[features]
#! ### Timer Queue Item Size
#! Sets the size of the timer items.

## 4 words
timer-item-size-4-words = []

## 6 words
timer-item-size-6-words = []

## 8 words
timer-item-size-8-words = []

[package.metadata.embassy_docs]
src_base = "https://github.com/jorgeandrecastro/Hazard3/blob/main/hazard3-executor-timer-queue/src/"
src_base_git = "https://github.com/jorgeandrecastro/Hazard3/blob/main/hazard3-executor-timer-queue/src/"
target = "x86_64-unknown-linux-gnu"

[package.metadata.embassy]
build = [
    {target = "thumbv7em-none-eabi", features = []},
    {target = "thumbv6m-none-eabi", features = []},
]
