[package]
name = "hazard3-futures"
version = "0.1.0"
edition = "2024"
description = "no-std, no-alloc utilities for working with futures"
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-futures"
readme = "README.md"
license = "MIT OR Apache-2.0"
exclude = ["target/", "Cargo.lock"]
categories = [
    "embedded",
    "no-std",
    "concurrency",
    "asynchronous",
]

[package.metadata.hazard3_docs]
src_base = "https://github.com/jorgeandrecastro/Hazard3/blob/main/hazard3-futures/src/"
src_base_git = "https://github.com/jorgeandrecastro/Hazard3/blob/$COMMIT/hazard3-futures/src/"
features = ["defmt"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt"]

[dependencies]
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

[features]
defmt = ["dep:defmt"]
log = ["dep:log"]
