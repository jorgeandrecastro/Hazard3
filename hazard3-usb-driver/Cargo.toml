[package]
name = "hazard3-usb-driver"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Driver trait for `embassy-usb`, an async USB device stack for embedded devices."
keywords = ["embedded", "async", "usb", "hal", "embedded-hal"]
readme = "README.md"
exclude = ["target/", "Cargo.lock"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/jorgeandrecastro/embassy-riscv"
documentation = "https://docs.rs/hazard3-usb-driver"

[package.metadata.embassy_docs]
src_base = "https://github.com/jorgeandrecastro/embassy-riscv/blob/main/hazard3-usb-driver/src/"
src_base_git = "https://github.com/jorgeandrecastro/embassy-riscv/blob/main/hazard3-usb-driver/src/"
features = ["defmt"]
target = "thumbv7em-none-eabi"

[package.metadata.docs.rs]
features = ["defmt"]

[lib]
name = "embassy_usb_driver"

[dependencies]
# TODO: remove before releasing embassy-usb-driver v0.3
embedded-io-async-06 = { package = "embedded-io-async", version = "0.6.1" }
embedded-io-async-07 = { package = "embedded-io-async", version = "0.7.0" }
defmt = { version = "1", optional = true }

[features]
defmt = ["dep:defmt"]
