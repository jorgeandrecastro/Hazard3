
[package]
name = "embassy-rp-riscv"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embassy Hardware Abstraction Layer (HAL) for the Raspberry Pi RP2040 or RP235x microcontroller"
keywords = ["embedded", "async", "rp235x", "rp2040", "embedded-hal"]
readme = "README.md"
exclude = ["target/", "Cargo.lock"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/jorgeandrecastro/embassy-riscv"
documentation = "https://docs.rs/embassy-rp-riscv"

[package.metadata.embassy]
build = [
    { target = "thumbv6m-none-eabi", features = ["defmt", "rp2040", "cortex-m", "time-driver"] },
    { target = "thumbv6m-none-eabi", features = ["log", "rp2040", "cortex-m", "time-driver"] },
    { target = "thumbv6m-none-eabi", features = ["intrinsics", "rp2040", "cortex-m", "time-driver"] },
    { target = "thumbv6m-none-eabi", features = ["qspi-as-gpio", "rp2040", "cortex-m", "time-driver"] },
    { target = "thumbv8m.main-none-eabihf", features = ["defmt", "rp235xa", "cortex-m", "time-driver"] },
    { target = "thumbv8m.main-none-eabihf", features = ["log", "rp235xa", "cortex-m", "time-driver"] },
    { target = "thumbv8m.main-none-eabihf", features = ["binary-info", "rp235xa", "cortex-m", "time-driver"] },
    { target = "thumbv8m.main-none-eabihf", features = ["defmt", "rp235xa", "cortex-m", "time-driver"] },
]

[package.metadata.embassy_docs]
src_base = "https://github.com/jorgeandrecastro/embassy-riscv/blob/main/embassy-rp/src/"
src_base_git = "https://github.com/jorgeandrecastro/embassy-riscv/blob/main/embassy-rp/src/"
features = ["defmt", "unstable-pac", "time-driver", "cortex-m"]
flavors = [
    { name = "rp2040", target = "thumbv6m-none-eabi", features = ["rp2040", "cortex-m"] },
    { name = "rp235xa", target = "thumbv8m.main-none-eabihf", features = ["rp235xa", "cortex-m"] },
    { name = "rp235xb", target = "thumbv8m.main-none-eabihf", features = ["rp235xb", "cortex-m"] },
]

[package.metadata.docs.rs]
features = ["defmt", "unstable-pac", "time-driver", "rp2040", "cortex-m"]

[lib]
name = "embassy_rp"

[features]
# Preserve the normal Cortex-M behavior for existing users.
default = ["rt", "cortex-m"]

# PAC interrupt vectors.
# This does not activate cortex-m-rt.
rt = ["rp-pac/rt"]

# CPU architecture selection.
cortex-m = [
    "dep:cortex-m",
    "embassy-hal-internal/cortex-m",
]

# Optional Cortex-M runtime, only when explicitly required.
cortex-m-rt = ["dep:cortex-m-rt"]

# RISC-V architecture selection.
# Does not activate Cortex-M dependencies.
riscv = ["embassy-hal-internal/riscv"]

# Logging and formatting.
defmt = [
    "dep:defmt",
    "embassy-usb-driver/defmt",
    "embassy-hal-internal/defmt",
    "embassy-time/defmt",
]

pac-defmt = ["rp-pac/defmt"]
pac-debug = ["rp-pac/debug"]
log = ["dep:log"]

# RTC API (RP2040 only).
jiff = ["dep:jiff"]

# Critical section implementation.
critical-section-impl = ["critical-section/restore-state-u8"]

# PAC re-export.
unstable-pac = []

# Embassy time driver.
time-driver = [
    "dep:embassy-time-driver",
    "embassy-time-driver?/tick-hz-1_000_000",
    "dep:embassy-time-queue-utils",
]

# Embassy executor.
executor-thread = ["dep:embassy-executor"]
executor-interrupt = ["dep:embassy-executor"]

# ROM and compiler optimizations.
rom-func-cache = []
intrinsics = []
rom-v2-intrinsics = []
qspi-as-gpio = []

# Execute from RAM.
run-from-ram = []

# RP2040 boot2 support.
boot2-at25sf128a = []
boot2-gd25q64cs = []
boot2-generic-03h = []
boot2-is25lp080 = []
boot2-ram-memcpy = []
boot2-w25q080 = []
boot2-w25x10cl = []
boot2-none = []

# RP2350 image definition.
imagedef-secure-exe = []
imagedef-nonsecure-exe = []
imagedef-none = []

# Chip selection: independent from CPU architecture.
rp2040 = ["rp-pac/rp2040"]

_rp235x = ["rp-pac/rp235x"]
rp235xa = ["_rp235x"]
rp235xb = ["_rp235x"]

# Tests.
_test = []

# Binary information.
binary-info = [
    "rt",
    "dep:rp-binary-info",
    "rp-binary-info?/binary-info",
]

[dependencies]
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }

embassy-time-driver = {
    version = "0.2.2",
    path = "../embassy-time-driver",
    optional = true,
}

embassy-time-queue-utils = {
    version = "0.3.2",
    path = "../embassy-time-queue-utils",
    optional = true,
}

embassy-time = {
    version = "0.5.1",
    path = "../embassy-time",
}

embassy-futures = {
    version = "0.1.2",
    path = "../embassy-futures",
}

# No unconditional Cortex-M activation.
embassy-hal-internal = {
    package = "embassy-hal-internal-riscv",
    version = "0.1.0",
    path = "../embassy-hal-internal",
    features = ["prio-bits-2"],
}

embassy-embedded-hal = {
    version = "0.6.0",
    path = "../embassy-embedded-hal",
}

embassy-usb-driver = {
    version = "0.2.2",
    path = "../embassy-usb-driver",
}

embassy-executor = {
    version = "0.10.0",
    path = "../embassy-executor",
    optional = true,
}

defmt = {
    version = "1.0.1",
    optional = true,
}

log = {
    version = "0.4.14",
    optional = true,
}

# Cortex-M dependencies: activated only by their features.
cortex-m = {
    version = "0.7.6",
    optional = true,
}

cortex-m-rt = {
    version = ">=0.6.15,<0.8",
    optional = true,
}

critical-section = "1.2.0"

jiff = {
    version = "1.0.0",
    default-features = false,
    optional = true,
}

embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-storage = "0.3"
embedded-storage-async = "0.4.1"

rp-pac = {
    package = "rp-pac-riscv",
    version = "0.1.0",
    path = "../rp-pac-riscv",
}

embedded-hal-02 = {
    package = "embedded-hal",
    version = "0.2.6",
    features = ["unproven"],
}

embedded-hal-1 = {
    package = "embedded-hal",
    version = "1.0",
}

embedded-hal-async = { version = "1.0" }

rand-core-10 = {
    package = "rand_core",
    version = "0.10",
}

pio = "0.4"
rp2040-boot2 = "0.3"
document-features = "0.2.10"

rp-binary-info = {
    version = "0.1.0",
    optional = true,
}

smart-leds-trait = "0.3.2"

[dev-dependencies]
embassy-executor = {
    version = "0.10.0",
    path = "../embassy-executor",
    features = ["platform-std", "executor-thread"],
}

static_cell = "2"
