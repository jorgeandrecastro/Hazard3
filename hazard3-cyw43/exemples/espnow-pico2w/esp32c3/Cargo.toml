[package]
name = "esp32c3mini"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = "0.10.0"
embassy-futures = "0.1"
embassy-sync = "0.7"
embassy-time = "0.5.0"
embassy-net = { version = "0.9.0", features = ["dhcpv4", "medium-ethernet", "tcp", "dns"] }

embedded-io-async = "0.7" 

esp-alloc = { version = "0.10.0", features = ["esp32c3"] }
esp-backtrace = { version = "0.19.0", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
esp-hal = { version = "1.1.0", features = ["esp32c3", "log-04", "unstable"] }
esp-println = { version = "0.17", default-features = false, features = ["esp32c3", "auto", "log-04"] }
esp-rtos = { version = "0.3.0", features = ["esp32c3", "esp-radio", "embassy", "log-04"] }
esp-radio = {
    version = "0.18.0",
    features = [
        "esp32c3",
        "log-04",
        "unstable",
        "wifi",
        "esp-now"
    ]
}
esp-phy = { version = "0.2.0", features = ["esp32c3"] }

trouble-host = "0.6"
bt-hci = "0.8"
heapless = "0.9"


log = "0.4.27"
static_cell = "2.1.0"

[build-dependencies]
esp-build = "0.3.0"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release.package.esp-radio]
opt-level = 3

[profile.release]
opt-level = "z"
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

