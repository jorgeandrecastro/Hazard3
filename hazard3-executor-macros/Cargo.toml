[package]
name = "hazard3-executor-macros"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "macros for creating the entry point and tasks for embassy-executor"
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-executor-macros"
readme = "README.md"
exclude = ["target/", "Cargo.lock"]
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[dependencies]
syn = { version = "3.0.9", features = ["full", "visit"] }
quote = "1.0.9"
proc-macro2 = "1.0.29"
proc-macro-crate = "3"

[lib]
proc-macro = true

[features]
nightly = []
metadata-name = []
