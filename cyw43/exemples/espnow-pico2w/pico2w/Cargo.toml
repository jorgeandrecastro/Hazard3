
[package]
name = "pico2-riscv"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]

# ============================================================
# LOGGING
# ============================================================

defmt = "1.0.1"
defmt-rtt = "1.0.0"

# ============================================================
# EMBASSY RISC-V
# ============================================================

embassy-embedded-hal = {
    package = "embassy-embedded-hal-riscv",
    version = "0.1"
}

embassy-executor = {
    package = "embassy-executor-riscv",
    version = "0.1.1",
    features = ["executor-thread", "defmt"]
}

embassy-time = {
    package = "embassy-time-riscv",
    version = "0.1",
    features = ["defmt", "defmt-timestamp-uptime"]
}

embassy-sync = {
    package = "embassy-sync-riscv",
    version = "0.1"
}

embassy-futures = "0.1.2"

embassy-rp = {
    package = "embassy-rp-riscv",
    version = "0.2",
    default-features = false,
    features = [
        "rp235xa",
        "riscv",
        "time-driver",
        "critical-section-impl",
        "defmt",
        "imagedef-none"
    ]
}

static_cell = "2.1"

# ============================================================
# RISC-V RUNTIME
# ============================================================

riscv-rt = {
    version = "0.18.0",
    optional = true
}

panic-halt = "0.2.0"

# ============================================================
# RP2350 LINKER
# ============================================================

rp2350-riscv-linker = "1.0.0"

# ============================================================
# DISPLAYS
# ============================================================

embassy-ssd1306 = {
    version = "0.7",
    default-features = false,
    features = ["time-riscv"]
}

# Adapt with the versions on Crates io
cyw43 = {
    package = "cyw43-riscv",
    path = "../embassy-riscv/cyw43",
    features = ["defmt", "action-frames"]
}
cyw43-setup = "1.0.0"
cyw43-pio-riscv = {
    # Décommente la ligne ci-dessous si Cargo indique : help: package `cyw43-pio` exists at ...
    # package = "cyw43-pio",
    path = "../embassy-riscv/cyw43-pio",
}

rp-pac-riscv = {
    path = "../embassy-riscv/rp-pac-riscv",
    features = ["rp235x"]
}


# Use the same local Embassy crates for direct and transitive dependencies.
[patch.crates-io]
embassy-embedded-hal-riscv = { path = "../embassy-riscv/embassy-embedded-hal" }
embassy-executor-riscv = { path = "../embassy-riscv/embassy-executor" }
embassy-executor-macros-riscv = { path = "../embassy-riscv/embassy-executor-macros" }
embassy-executor-timer-queue-riscv = { path = "../embassy-riscv/embassy-executor-timer-queue" }
embassy-futures = { path = "../embassy-riscv/embassy-futures" }
embassy-hal-internal-riscv = { path = "../embassy-riscv/embassy-hal-internal" }
embassy-rp-riscv = { path = "../embassy-riscv/embassy-rp" }
embassy-sync-riscv = { path = "../embassy-riscv/embassy-sync" }
embassy-time-riscv = { path = "../embassy-riscv/embassy-time" }
embassy-time-driver-riscv = { path = "../embassy-riscv/embassy-time-driver" }
embassy-time-queue-utils-riscv = { path = "../embassy-riscv/embassy-time-queue-utils" }
embassy-usb-driver-riscv = { path = "../embassy-riscv/embassy-usb-driver" }
rp-pac-riscv = { path = "../embassy-riscv/rp-pac-riscv" }
unitrait-riscv = { path = "../embassy-riscv/unitrait" }
unitrait-macros-riscv = { path = "../embassy-riscv/unitrait-macros" }

# ============================================================
# FEATURES
# ============================================================

[features]
default = ["riscv-target"]

riscv-target = [
    "dep:riscv-rt",
    "embassy-executor/platform-riscv32"
]

# ============================================================
# RELEASE PROFILE
# ============================================================

[profile.release]
debug = true
lto = true
opt-level = "z"
panic = "abort"
