[package]
name = "unitrait-macros-riscv"
version = "0.1.0"
edition = "2024"
description = "Implementation detail of the `unitrait` crate"
repository = "https://github.com/jorgeandrecastro/embassy-riscv"
documentation = "https://docs.rs/unitrait-macros-riscv"
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = ["target/", "Cargo.lock"]

[lib]
name = "unitrait_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
unitrait = { package = "unitrait-riscv", path = "../unitrait" }
