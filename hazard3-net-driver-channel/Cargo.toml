[package]
name = "hazard3-net-driver-channel"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "High-level channel-based driver for the `embassy-net` async TCP/IP network stack."
repository = "https://github.com/jorgeandrecastro/Hazard3"
documentation = "https://docs.rs/hazard3-net-driver-channel"
readme = "README.md"
exclude = ["target/", "Cargo.lock"]
categories = [
    "embedded",
    "no-std",
    "asynchronous",
]

[package.metadata.embassy_docs]
src_base = "https://github.com/jorgeandrecastro/Hazard3/blob/main/hazard3-net-driver-channel/src/"
src_base_git = "https://github.com/jorgeandrecastro/Hazard3/blob/$COMMIT/hazard3-net-driver-channel/src/"
features = ["defmt"]
target = "riscv32imac-unknown-none-elf"

[package.metadata.docs.rs]
default-target = "riscv32imac-unknown-none-elf"
targets = ["riscv32imac-unknown-none-elf"]
features = ["defmt"]

[lib]

[dependencies]
defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

hazard3-sync = { version = "0.3.0", path = "../hazard3-sync" }
hazard3-net-driver = { version = "0.3.0", path = "../hazard3-net/hazard3-net-driver", features = ["async"] }

[features]
defmt = ["dep:defmt", "hazard3-net-driver/defmt"]
log = ["dep:log"]
